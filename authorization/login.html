<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/desktop.css" />
    <link rel="stylesheet" href="../css/tablet.css" media="screen and (min-width: 769px) and (max-width: 1024px)" />
    <link rel="stylesheet" href="../css/mobile.css" media="screen and (max-width: 768px)" />
    <title>Log in - Klarna</title>
    <style>
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; text-align: left; }
        .form-group label { font-size: 14px; font-weight: 500; margin-bottom: 5px; }
        .form-group input { padding: 12px 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; font-family: 'Roboto', sans-serif; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: #ffb3c7; box-shadow: 0 0 5px rgba(255,179,199,0.5); }
        .error-message { color: #d32f2f; font-size: 12px; margin-top: 5px; display: none; }
        .form-group.error input { border-color: #d32f2f; background-color: #fff4f4; }
        .form-group.error .error-message { display: block; }
    </style>
  </head>
  <body style="font-family: 'Roboto', sans-serif; background-color: #f9f9f9;">
    <div id="header-placeholder"></div>

    <main style="padding: 60px 20px; display: flex; justify-content: center; min-height: 60vh; align-items: center;">
      <div style="background: #fff; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center;">
        
        <h1 style="font-size: 28px; margin-bottom: 10px;">Welcome back</h1>
        <p style="color: #666; margin-bottom: 30px; font-size: 14px;">Enter your details to log in.</p>
        
        <form id="login-form" novalidate>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="example@mail.com" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" required>
                <div class="error-message" id="login-error">Invalid email or password</div>
            </div>

            <button type="submit" id="btn-submit-login" class="button_hero_11 button_black_11" style="width: 100%; border-radius: 50px; margin-top: 10px;">Log in</button>
            
            <p style="margin-top: 20px; font-size: 14px; color: #666;">
                Don't have an account? <a href="register.html" style="color: #000; font-weight: bold; text-decoration: underline;">Sign up</a>
            </p>
        </form>
      </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../components.js"></script>
    <script src="login.js"></script>
  </body>
</html>
