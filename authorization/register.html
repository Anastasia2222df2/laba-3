<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/desktop.css" />
    <link rel="stylesheet" href="../css/tablet.css" media="screen and (min-width: 769px) and (max-width: 1024px)" />
    <link rel="stylesheet" href="../css/mobile.css" media="screen and (max-width: 768px)" />
    
    <title>Register - Klarna</title>

    <style>
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; text-align: left; }
        .form-group label { font-size: 14px; font-weight: 500; margin-bottom: 5px; }
        .form-group input { padding: 12px 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; font-family: 'Roboto', sans-serif; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: #ffb3c7; box-shadow: 0 0 5px rgba(255,179,199,0.5); }
        .error-message { color: #d32f2f; font-size: 12px; margin-top: 5px; display: none; }
        
        /* Класс error будет вешаться через JavaScript, когда данные невалидны */
        .form-group.error input { border-color: #d32f2f; background-color: #fff4f4; }
        .form-group.error .error-message { display: block; }
    </style>
  </head>
  <body style="font-family: 'Roboto', sans-serif; background-color: #f9f9f9;">
    <div id="header-placeholder"></div>

    <main style="padding: 60px 20px; display: flex; justify-content: center;">
      <div style="background: #fff; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 500px; text-align: center;">
        
        <h1 style="font-size: 28px; margin-bottom: 30px;">Create an account</h1>
        <form id="register-form" novalidate>
            
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>First Name *</label>
                    <input type="text" id="reg-firstname" required>
                    <div class="error-message">Required field</div>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Last Name *</label>
                    <input type="text" id="reg-lastname" required>
                    <div class="error-message">Required field</div>
                </div>
            </div>
            <div class="form-group">
                <label>Middle Name (Optional)</label>
                <input type="text" id="reg-middlename">
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="reg-email" placeholder="example@mail.com" required>
                <div class="error-message">Enter a valid email</div>
            </div>
            <div class="form-group">
                <label>Phone Number (Belarus) *</label>
                <input type="tel" id="reg-phone" placeholder="+375XXXXXXXXX" required>
                <div class="error-message">Must start with +375 and have 12 chars</div>
            </div>

            <div class="form-group">
                <label>Date of Birth *</label>
                <input type="date" id="reg-birthdate" required>
                <div class="error-message">You must be at least 16 years old</div>
            </div>

            <div class="form-group">
                <label>Nickname *</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="reg-nickname" readonly style="flex: 1; background: #f0f0f0;" placeholder="Click Generate">
                    <button type="button" id="btn-generate-nick" class="button_hero_11 button_white_11" style="height: auto; padding: 0 15px; border: 1px solid #000; border-radius: 8px;">Generate</button>
                </div>
                <div class="error-message" id="nick-error">Generate a unique nickname</div>
            </div>

            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="reg-password" required>
                <div class="error-message">8-20 chars, 1 uppercase, 1 lowercase, 1 number, 1 special char</div>
            </div>
            <div class="form-group">
                <label>Confirm Password *</label>
                <input type="password" id="reg-password-confirm" required>
                <div class="error-message">Passwords do not match</div>
            </div>

            <div class="form-group" style="flex-direction: row; align-items: center; gap: 10px;">
                <input type="checkbox" id="reg-terms" style="width: 20px; height: 20px; cursor: pointer;">
                <label for="reg-terms" style="margin: 0; font-size: 13px; color: #666;">I agree to the <a href="#" style="color: #ffb3c7;">Terms of Service</a> *</label>
            </div>
            <div class="error-message" id="terms-error" style="text-align: left;">You must agree to the terms</div>

            <button type="submit" id="btn-submit-reg" class="button_hero_11 button_black_11" style="width: 100%; border-radius: 50px; margin-top: 20px; opacity: 0.5; pointer-events: none; transition: 0.3s;" disabled>Sign up</button>

        </form>
      </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../components.js"></script>
    <script src="register.js"></script>
  </body>
</html>
