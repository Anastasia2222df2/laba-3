<!doctype html>
<html lang="ru">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Klarna</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header__logo">
          <img src="img/logo.svg" alt="Klarna Logo" />
        </div>
        <div class="header__nav">
          <div>Shopping categories</div>
          <div>Deals and rewards</div>
          <div>How Klarna works</div>
          <div>Help</div>
        </div>
        <div class="header__auth">
          <div>Log in</div>
          <div class="btn-black">Sign up</div>
        </div>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="hero__container">
          <div class="hero__left">
            <h1>
              Find it. Compare it.<br />
              And pay how you<br />
              like.
            </h1>

            <div class="search-box">
              <button class="search-btn-icon">
                <img src="img/Vector.svg" alt="search" class="search_button" />
              </button>
              <input type="text" placeholder="" class="text" />
              <button class="search-btn-arrow">
                <img src="img/Frame (2).svg" alt="go" class="go_button" />
              </button>
            </div>
          </div>

          <img src="img/style_girl.jpg" alt="Girl" class="hero__image" />
        </div>
      </section>
      <section class="hero_2">
      </section>
    </main>
    <footer></footer>
  </body>
</html>
